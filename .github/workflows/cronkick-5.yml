# Probe twin of every-5.yml: the same job and cron, triggered by Cronkick instead of GitHub's scheduler.
# The lateness page compares the two, both measured from GitHub's run list.
name: probe every 5 min (Cronkick)
on:
  workflow_dispatch: # cronkick: "*/5 * * * *"
permissions: {}
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - run: echo "scheduled tick"
